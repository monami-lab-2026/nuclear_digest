name: Weekly nuclear jobs

on:
  schedule:
    # Sunday 23:37 UTC = Monday 08:37 KST, after the 07:00 KST weekly paper run
    # (GitHub usually starts scheduled runs 1–3 hours late; both share the site-publish queue).
    - cron: "37 23 * * 0"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also read past postings to fill the trend charts"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-publish  # shared with the news and paper workflows: all publish the same site
  cancel-in-progress: false

jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect postings and build pages
        run: |
          args=""
          [ "${{ inputs.backfill }}" = "true" ] && args="--backfill"
          python -m app.jobs.run_daily $args

      - name: Commit data and site
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/jobs state/jobs docs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "원자력 취업 공고 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: jobs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
